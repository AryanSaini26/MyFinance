# Independent, disposable test stack. No .env, published ports, or development volume.
services:
  test-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: myfinance_test
      POSTGRES_PASSWORD: disposable_test_only
      POSTGRES_DB: myfinance_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfinance_test -d myfinance_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  node-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile.node
    environment:
      DATABASE_URL: postgres://myfinance_test:disposable_test_only@test-db:5432/myfinance_test?sslmode=disable
      PLAID_MODE: mock
      PLAID_ENV: sandbox
    depends_on:
      test-db: { condition: service_healthy }
  go-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile.go
    environment:
      TEST_DATABASE_URL: postgres://myfinance_test:disposable_test_only@test-db:5432/myfinance_test?sslmode=disable
      REQUIRE_INTEGRATION_TESTS: "1"
    depends_on:
      test-db: { condition: service_healthy }
